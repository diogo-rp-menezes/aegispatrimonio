apiVersion: v1
kind: Namespace
metadata:
  name: aegis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegis-app-config
  namespace: aegis
  labels:
    app: aegis-app
data:
  APP_CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://localhost:3000"
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "none"
---
apiVersion: v1
kind: Secret
metadata:
  name: aegis-app-secrets
  namespace: aegis
  labels:
    app: aegis-app
type: Opaque
# NOTE: Do NOT commit real secret values here. Manage this Secret out-of-band via
# Sealed Secrets (kubeseal) or External Secrets Operator, or create it manually:
#   kubectl -n aegis create secret generic aegis-app-secrets \
#     --from-literal=SPRING_DATASOURCE_URL=... \
#     --from-literal=SPRING_DATASOURCE_USERNAME=... \
#     --from-literal=SPRING_DATASOURCE_PASSWORD=... \
#     --from-literal=JWT_SECRET=...
stringData:
  SPRING_DATASOURCE_URL: "<set-via-sealed-secrets-or-external-secrets>"
  SPRING_DATASOURCE_USERNAME: "<set-via-sealed-secrets-or-external-secrets>"
  SPRING_DATASOURCE_PASSWORD: "<set-via-sealed-secrets-or-external-secrets>"
  JWT_SECRET: "<set-via-sealed-secrets-or-external-secrets>"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-app
  namespace: aegis
  labels:
    app: aegis-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-app
  template:
    metadata:
      labels:
        app: aegis-app
    spec:
      containers:
        - name: aegis-app
          # Placeholder versionado: o CI/deploy DEVE injetar a tag real da imagem
          # (ex.: via `kubectl set image` ou kustomize image override).
          # Nunca usar :latest em produção (imutabilidade de versão).
          image: aegispatrimonio:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: aegis-app-config
            - secretRef:
                name: aegis-app-secrets
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=75 -XX:MaxMetaspaceSize=256m -XX:+UseStringDeduplication -XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp -Dfile.encoding=UTF-8"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
---
# PDB: garante que drains de nó (atualizações do cluster) não derrubem todas as
# réplicas do app simultaneamente (2 réplicas, minAvailable: 1).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aegis-app
  namespace: aegis
  labels:
    app: aegis-app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: aegis-app
---
# NetworkPolicy: ingress default-deny + allow 8080 de qualquer origem.
# Justificativa: não há Ingress/Controller definido no repo, então restringir por
# label de origem quebraria um cluster genérico. Egress deixado livre — restrição
# de egress (DNS + MySQL 3306) registrada como pendência (requer teste em cluster
# com CNI que suporte NetworkPolicy).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aegis-app-allow-8080
  namespace: aegis
  labels:
    app: aegis-app
spec:
  podSelector:
    matchLabels:
      app: aegis-app
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-app
  namespace: aegis
  labels:
    app: aegis-app
spec:
  type: ClusterIP
  selector:
    app: aegis-app
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-mysql
  namespace: aegis
  labels:
    app: aegis-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis-mysql
  template:
    metadata:
      labels:
        app: aegis-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aegis-app-secrets
                  key: SPRING_DATASOURCE_PASSWORD
            - name: MYSQL_DATABASE
              value: aegis-patrimonio
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
          readinessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: mysql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: aegis-mysql
  namespace: aegis
  labels:
    app: aegis-mysql
spec:
  type: ClusterIP
  selector:
    app: aegis-mysql
  ports:
    - port: 3306
      targetPort: 3306
      protocol: TCP
      name: mysql
